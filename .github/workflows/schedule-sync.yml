name: Weekly Schedule Sync

on:
  # Run every Monday at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * 1'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate fresh cookies via automated login
        env:
          WIGOR_USERNAME: ${{ secrets.WIGOR_USERNAME }}
          WIGOR_PASSWORD: ${{ secrets.WIGOR_PASSWORD }}
          WIGOR_COOKIE: ${{ secrets.WIGOR_COOKIE }}
        run: |
          # Ensure data directory exists
          mkdir -p data

          # Create input for automated login script
          echo "$WIGOR_USERNAME" > /tmp/login_input.txt
          echo "$WIGOR_PASSWORD" >> /tmp/login_input.txt
          echo "y" >> /tmp/login_input.txt
          
          # Run automated login
          cat /tmp/login_input.txt | python scripts/wigor_login.py || {
            echo "Automated login failed, checking for fallback cookie secret"
            if [ -n "$WIGOR_COOKIE" ]; then
              echo "Using fallback cookie from secrets"
              echo "$WIGOR_COOKIE" > data/cookie
            else
              echo "ERROR: Both automated login and fallback cookie failed"
              exit 1
            fi
          }
          
          # Clean up temporary file
          rm -f /tmp/login_input.txt

      - name: Create Google credentials from secrets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          mkdir -p data
          echo "$GOOGLE_CREDENTIALS" > data/credentials.json

      - name: Restore Google token cache
        uses: actions/cache@v3
        with:
          path: data/token.pickle
          key: google-token-${{ runner.os }}

      - name: Restore Google token from secret (Fallback)
        if: always()
        env:
          GOOGLE_TOKEN_BASE64: ${{ secrets.GOOGLE_TOKEN_BASE64 }}
        run: |
          # Only attempt if file doesn't exist yet (cache miss)
          if [ ! -f "data/token.pickle" ]; then
            if [ -n "$GOOGLE_TOKEN_BASE64" ]; then
              echo "Restoring token from secret..."
              echo "$GOOGLE_TOKEN_BASE64" | base64 -d > data/token.pickle
            else
              echo "No token secret found and cache missed. Authentication may fail."
            fi
          fi

      - name: Run schedule scraper
        run: |
          python main.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-scraper-log-${{ github.run_number }}
          path: logs/schedule_scraper.log
          retention-days: 30

      - name: Upload events JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: events-json-${{ github.run_number }}
          path: data/events.json
          retention-days: 7

      - name: Save Google token cache
        if: success()
        uses: actions/cache/save@v3
        with:
          path: data/token.pickle
          key: google-token-${{ runner.os }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Schedule scraper failed. Check the logs for details."

